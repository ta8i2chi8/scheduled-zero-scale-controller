---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - sre.example.com
  resources:
  - scheduledzeroscales
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sre.example.com
  resources:
  - scheduledzeroscales/finalizers
  verbs:
  - update
- apiGroups:
  - sre.example.com
  resources:
  - scheduledzeroscales/status
  verbs:
  - get
  - patch
  - update
